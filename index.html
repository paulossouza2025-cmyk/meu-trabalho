<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="MEU TRABALHO — organização da jornada e painel operacional">
<title>MEU TRABALHO</title>
<style>
:root{--navy:#111827;--blue:#2857d9;--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding-bottom:86px}
header{background:var(--navy);color:#fff;padding:28px 24px 24px}
header h1{margin:0;font-size:31px;line-height:1.1;font-weight:800}
header p{margin:10px 0 0;color:#cbd5e1;font-size:17px}
main{max-width:760px;margin:0 auto;padding:20px 22px}
.card{background:var(--card);border-radius:25px;margin-bottom:18px;padding:25px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hero{background:var(--navy);color:#fff;padding:25px;border-radius:25px;margin-bottom:18px}
.date{font-size:18px;color:#d1d5db;margin-bottom:12px}
.hero h2{font-size:34px;margin:0 0 10px;line-height:1.05}
.hero .shift{font-size:35px;font-weight:800;line-height:1.1;margin-bottom:12px}
.hero p{font-size:20px;line-height:1.25;margin:0}
.card h3{font-size:25px;margin:0 0 18px}
.weather-box{background:#eef5ff;border:1px solid #d8e5fa;border-radius:22px;padding:20px;display:flex;gap:20px;align-items:center}
.weather-icon{font-size:54px;flex:0 0 58px;text-align:center}
.temp{font-size:44px;font-weight:800;line-height:1}
.condition{font-size:23px;font-weight:700;margin-top:5px}
.details{font-size:18px;color:#4b5563;line-height:1.35}
.source{color:#6b7280;font-size:16px;margin:12px 3px 16px}
.btn{display:block;width:100%;border:0;border-radius:19px;padding:18px 16px;font-size:20px;text-decoration:none;text-align:center;cursor:pointer;margin-top:10px}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:#e5e7eb;color:#111827}
.scale-card p{font-size:18px;color:#6b7280;line-height:1.35;margin:0 0 18px}
.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.nav button{border:0;background:transparent;color:#6b7280;font-size:14px;padding:10px 3px;border-radius:17px;cursor:pointer}
.nav button.active{background:var(--navy);color:#fff}
.nav .ico{display:block;font-size:22px;line-height:1;margin-bottom:5px}
.view{display:none}
.view.active{display:block}
.simple h2{font-size:28px;margin-top:0}
.simple p{font-size:18px;color:var(--muted);line-height:1.45}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-action{border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:18px;text-align:left;cursor:pointer}
.admin-action strong{display:block;font-size:18px;color:#111827;margin-bottom:6px}
.admin-action span{display:block;color:#6b7280;font-size:14px;line-height:1.3}
.admin-badge{display:inline-block;background:#e8efff;color:#2857d9;padding:7px 11px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:15px}
.logout{margin-top:18px}
@media(max-width:430px){
header{padding:27px 24px 23px}
header h1{font-size:29px}
main{padding:19px 22px}
.hero h2{font-size:31px}
.hero .shift{font-size:34px}
.weather-box{padding:17px;gap:14px}
.weather-icon{font-size:44px;flex-basis:48px}
.temp{font-size:39px}
.condition{font-size:20px}
.details{font-size:16px}
.admin-grid{grid-template-columns:1fr}
}
</style>

.login-card p{margin:0 0 24px;color:#6b7280;font-size:17px}

.login-btn{width:100%;margin-top:22px;padding:18px;border:0;border-radius:18px;background:#2857d9;color:#fff;font-size:19px;font-weight:700}
